
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog Personal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f3ef;
            margin: 0;
            padding: 40px 20px;
            color: #493b38;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #a47778;
        }

        h2 {
            color: #a47778;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfd1ce;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 13px;
            background-color: #a47778;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #855d5e;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Mi Blog Personal</h1>

        <p>Un espacio para compartir pensamientos,
           experiencias e historias.</p>

        <h2>Crear una publicación</h2>

        <form action="publicaciones" method="post">

            <label for="titulo">Título:</label>
            <input type="text" id="titulo"
                   name="titulo" required maxlength="200">

            <label for="contenido">Contenido:</label>
            <textarea id="contenido"
                      name="contenido" required></textarea>

            <button type="submit">Publicar</button>

        </form>

    </div>

</body>
</html>
